<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Year/Month PDF Loader</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    width: 100%;
    display: flex;
    color: #000;
    background-color: #CFF;
}

/* LEFT SIDE: Vertical Tabs */
.vertical-tabs {
    width: 80px;
    background: #f0f0f0;
    border-right: 2px solid #ccc;
    padding: 10px;
    box-sizing: border-box;
    overflow-y: auto;
}
.vtab {
    padding: 10px;
    background: #e0e0e0;
    margin-bottom: 6px;
    cursor: pointer;
    border-radius: 4px;
}
.vtab.active {
    background: #4CAF50;
    color: white;
}

/* RIGHT SIDE CONTENT AREA */
.content-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
}
.subtab-bar {
    padding: 10px;
    background: #fafafa;
    border-bottom: 2px solid #ccc;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}
.subtab {
    padding: 6px 10px;
    background: #e8e8e8;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
}
.subtab:hover {
    background: #d0d0d0;
}
.main-content {
    padding: 15px;
    overflow-y: auto;
}
#yearTitle {
    color: #333333;
    text-align: center;
    font-size: 36px;
}
.month-label {
    text-align: center;
    font-weight: bold;
}

/* RED POPUP */
#pdfPopup {
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    background:#FF0000;
    color:white;
    padding:25px 35px;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
    z-index:9999;
    text-align:center;
}
#pdfPopup button {
    padding:10px 20px;
    font-size:16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:20px;
}
</style>
</head>

<body>

<!-- LEFT: YEAR TABS -->
<div class="vertical-tabs">
    <div class="vtab" data-year="Years"><em>Year</em></div>
    <div class="vtab active" data-year="2008">2008</div>
    <div class="vtab" data-year="2009">2009</div>
    <div class="vtab" data-year="2010">2010</div>
    <div class="vtab" data-year="2011">2011</div>
    <div class="vtab" data-year="2012">2012</div>
    <div class="vtab" data-year="2013">2013</div>
    <div class="vtab" data-year="2014">2014</div>
    <div class="vtab" data-year="2015">2015</div>
    <div class="vtab" data-year="2016">2016</div>
    <div class="vtab" data-year="2017">2017</div>
    <div class="vtab" data-year="2018">2018</div>
    <div class="vtab" data-year="2019">2019</div>
    <div class="vtab" data-year="2020">2020</div>
    <div class="vtab" data-year="2021">2021</div>
    <div class="vtab" data-year="2022">2022</div>
    <div class="vtab" data-year="2023">2023</div>
    <div class="vtab" data-year="2024">2024</div>
    <div class="vtab" data-year="2025">2025</div>
</div>

<!-- RIGHT: SUB-TABS + CONTENT -->
<div class="content-area">
    <div class="month-label">Months</div>
    <div id="subtabBar" class="subtab-bar"></div>
    <div class="main-content">
        <h2 id="yearTitle">2008</h2>
        <h2><p align="center">Click on a month to open the Breeze PDF</p></h2>
    </div>
</div>

<!-- RED POPUP -->
<div id="pdfPopup">
    <div id="pdfPopupMessage"></div>
    <button onclick="closePDFPopup()">Close</button>
</div>

<script>
const tabs = document.querySelectorAll('.vtab');
const subtabBar = document.getElementById('subtabBar');
const yearTitle = document.getElementById('yearTitle');

/* Build URL as a pure relative path */
function buildURL(year, month) {
    return `${year}/Breeze_${year}-${month}.pdf`;
}

/* Show red popup */
function showPDFPopup(message) {
    document.getElementById('pdfPopupMessage').textContent = message;
    document.getElementById('pdfPopup').style.display = 'block';
}
function closePDFPopup() {
    document.getElementById('pdfPopup').style.display = 'none';
}

/* Test PDF existence using HEAD request */
async function testPDF(url, onSuccess) {
    try {
        const response = await fetch(url, { method: 'HEAD' });
        if (response.ok) {
            onSuccess();
        } else {
            showPDFPopup("Missing PDF:\n" + url);
        }
    } catch (e) {
        showPDFPopup("Missing PDF:\n" + url);
    }
}

/* Generate month subtabs */
function showSubtabs(year) {
    subtabBar.innerHTML = '';

    for (let m = 1; m <= 12; m++) {
        const mm = String(m).padStart(2, '0');
        const div = document.createElement('div');
        div.className = 'subtab';
        div.textContent = `${year}-${mm}`;

        div.addEventListener('click', () => {
            const url = buildURL(year, mm);
            testPDF(url, () => {
                window.location.href = url;
            });
        });

        subtabBar.appendChild(div);
    }

    yearTitle.textContent = year;
}

/* Year tab click handler */
tabs.forEach(tab => {
    tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        const year = tab.dataset.year;
        showSubtabs(year);
    });
});

/* Initial load */
showSubtabs('2008');
</script>

</body>
</html>
